<!-- This file is used in an Elementor HTML block on the https://fourpaws.org/petco-sterling-adoption-fair/ and
https://fourpaws.org/petco-fairfax-adoption-fair/ pages. It is used to display
the list of cats that will be attending the adoption fair in a grid of cards.
The list is pulled from Shelterluv using a saved query ID. The saved query ID is
set in the `savedQuery` variable in the script below. If you need to change the
list of cats, you will need to uncomment the appropriate saved query ID for the
adoption fair you want to update and comment out the other one. The Sterling
adoption fair query ID is 5756, and the Fairfax adoption fair query ID is 5752. -->

<style>
	.paws-adoption-cards {
		display: grid;
		grid-template-columns: repeat(auto-fill, minmax(10.63rem, 1fr));
		gap: 1rem;
		width: 100%;
	}

	.paws-cat-card {
		display: flex;
		flex-direction: column;
		height: 100%;
		background: #fff;
		border-radius: 20px;
		overflow: hidden;
		text-decoration: none !important;
		color: inherit;
		border: 4px solid #dbe0e6 !important;
		transition:
			transform 0.5s ease,
			box-shadow 0.2s ease;
	}

	a.paws-cat-card:hover {
		text-decoration: none !important;
		box-shadow: rgba(149, 157, 165, 0.2) 0px 8px 24px;
		border: 4px solid #a5b1c0 !important;
		transform: translateY(-4px);
	}

	.paws-cat-card,
	.paws-cat-card:hover,
	.paws-cat-card:focus,
	.paws-cat-card:visited {
		text-decoration: none !important;
		color: inherit;
	}

	.paws-cat-card img {
		display: block;
		width: 100%;
		aspect-ratio: 4 / 3;
		object-fit: cover;
	}

	.paws-cat-content {
		display: flex;
		flex-direction: column;
		flex: 1;
		padding: 1rem;
	}

	.paws-cat-name {
		margin: 0 0 6px;
		font-size: 1rem;
		font-weight: 700;
		line-height: 1.2;
		padding: 0;
	}

	p.paws-cat-details {
		margin: 0;
		color: #223762;
		font-size: 0.8rem !important;
		line-height: 1.4;
	}

	.paws-no-cats {
		grid-column: 1 / -1;
		padding: 3rem 2rem;
		text-align: center;
		border: 4px solid #dbe0e6;
		border-radius: 20px;
		background: #fff;
	}

	.paws-no-cats p {
		margin: 0 0 1rem;
		color: #213862 !important;
	}

	.paws-no-cats-link {
		font-weight: 700;
	}
</style>

<script>
	document.addEventListener('DOMContentLoaded', async () => {
		// Below are the two queries for the adoption fair attendees. Only use one at a time. The Sterling adoption fair query is currently active. If you want to switch to the Fairfax adoption fair query, comment out the Sterling query and uncomment the Fairfax query.

		// Sterling adoption fair query ID: 5756.
		const savedQuery = 5756;

		// Fairfax adoption fair query ID: 5752.
		// const savedQuery = 5752;

		fetch(
			'https://new.shelterluv.com/api/v3/available-animals/531?saved_query=' +
				savedQuery,
		)
			.then((r) => r.json())
			.then(console.log)
			.catch(console.error);

		const container = document.querySelector('.paws-adoption-cards');

		try {
			const response = await fetch(
				`https://new.shelterluv.com/api/v3/available-animals/531?saved_query=${savedQuery}`,
			);

			const data = await response.json();

			container.innerHTML = '';

			if (!data.animals || data.animals.length === 0) {
				container.innerHTML = `
                <div class="paws-no-cats">
                    <p><strong>No featured cats at the moment.</strong></p>
                    <p>
                        Please check back soon or visit our full list of adoptable cats.
                    </p>
                    <p>
                        <a href="https://fourpaws.org/adopt-a-cat/available-cats/" class="paws-no-cats-link">
                            View All Adoptable Cats →
                        </a>
                    </p>
                </div>
            `;
				return;
			}

			data.animals.forEach((animal) => {
				const photos = Object.values(animal.photos || {});
				const cover = photos.find((photo) => photo.isCover) || photos[0];

				// Calculate age from the birthday timestamp
				let ageText = 'Unknown';

				if (animal.birthday) {
					const birthday = new Date(Number(animal.birthday) * 1000);
					const today = new Date();

					let years = today.getFullYear() - birthday.getFullYear();
					let months = today.getMonth() - birthday.getMonth();

					if (today.getDate() < birthday.getDate()) {
						months--;
					}

					if (months < 0) {
						years--;
						months += 12;
					}

					if (years > 0) {
						ageText = years === 1 ? '1 year' : `${years} years`;
					} else {
						ageText = months === 1 ? '1 month' : `${months} months`;
					}
				}

				container.insertAdjacentHTML(
					'beforeend',
					`
                <a class="paws-cat-card"
                   href="${animal.public_url}"
                   target="_blank"
                   rel="noopener">

                    <img
                        src="${cover ? cover.url : ''}"
                        alt="${animal.name}"
                        loading="lazy">

                    <div class="paws-cat-content">

                        <h3 class="paws-cat-name">${animal.name}</h3>

                        <p class="paws-cat-details">
                            <strong>Age:</strong> ${ageText}
                        </p>

                    </div>

                </a>
            `,
				);
			});
		} catch (error) {
			console.error(error);

			container.innerHTML =
				"<p>Sorry, we couldn't load the cats right now.</p>";
		}
	});
</script>
