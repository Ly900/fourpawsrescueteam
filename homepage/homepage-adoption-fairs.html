<!-- Generates the two adoption fair cards on the homepage. The cards are populated with the next two upcoming adoption fairs. If there are no upcoming adoption fairs, the cards will be hidden and a message will be displayed instead. -->

<!-- REQUIRES adoption-fairs-data.html, which defines window.FourPaws.data.
     That block must come before this one on the page. Event dates and store
     details are edited there, not here. -->
<style>
	.event-date-today .elementor-heading-title {
		color: #009688 !important;
		font-weight: 700;
	}

	.event-date-canceled .elementor-heading-title {
		color: #d32f2f !important;
		font-weight: 700;
	}

	/* The link and arrow stay hidden until the script confirms the
	   attendees list is live (the Monday of the event week). Hiding by
	   default means the link never flashes before the script runs.
	   The placeholder message is a direct p child too, so it starts
	   hidden here as well. */
	.event-attendees .elementor-widget-container > p,
	.event-attendees-arrow {
		display: none;
	}

	/* Reveal the real link and arrow, but never the placeholder. */
	.attendees-ready
		.event-attendees
		.elementor-widget-container
		> p:not(.event-attendees-pending),
	.attendees-ready .event-attendees-arrow {
		display: block;
	}

	/* Written out in full so this outweighs the hiding rule above;
	   a shorter selector loses on specificity and the message
	   never appears. */
	.attendees-pending
		.event-attendees
		.elementor-widget-container
		> p.event-attendees-pending {
		display: block;
		margin: 0;
	}
</style>

<script>
	document.addEventListener('DOMContentLoaded', () => {
		// =========================================================
		// SHARED EVENT DATA
		// Event dates and store details live in the global data
		// block (adoption-fairs-data.html), which must load before
		// this script. Nothing here needs editing when the schedule
		// changes.
		// =========================================================

		const data = window.FourPaws && window.FourPaws.data;
		const events = data && data.adoptionEvents;
		const stores = data && data.stores;

		if (!Array.isArray(events) || !stores) {
			console.error(
				'Adoption fair data is missing. Check that the adoption fair data block is on this page and appears above the homepage adoption fair block.',
			);

			return;
		}

		// =========================================================
		// CARD ELEMENTS
		// =========================================================

		const cards = [
			document.getElementById('event1-card'),
			document.getElementById('event2-card'),
		];

		// Stop if neither card exists on the page.
		if (!cards.some(Boolean)) {
			return;
		}

		// =========================================================
		// ADDRESS FORMATTING
		// The shared data keeps each address as one plain string.
		// The cards show it on two lines, with the state abbreviated
		// and non-breaking spaces holding "Fairfax VA, 22030"
		// together.
		// =========================================================

		const stateNames = {
			VA: 'Virginia',
			MD: 'Maryland',
			DC: 'District of Columbia',
		};

		// '10708 Fairfax Blvd, Fairfax, VA 22030' becomes
		// ['10708 Fairfax Blvd', 'Fairfax&nbsp;<abbr ...>VA</abbr>,&nbsp;22030'].
		// An address that does not follow the expected
		// "street, city, ST zip" shape is passed through unchanged
		// rather than dropped, so a typo never blanks out a card.
		function formatAddressLines(address) {
			const firstComma = address.indexOf(',');

			if (firstComma === -1) {
				return [address, ''];
			}

			const street = address.slice(0, firstComma).trim();
			const remainder = address.slice(firstComma + 1).trim();

			// city, ST zip
			const match = remainder.match(/^(.+),\s*([A-Z]{2})\s+([\d-]+)$/);

			if (!match) {
				return [street, remainder];
			}

			const [, city, state, zip] = match;
			const stateName = stateNames[state] || state;

			return [
				street,
				`${city}&nbsp;<abbr title="${stateName}">${state}</abbr>,&nbsp;${zip}`,
			];
		}

		// =========================================================
		// FIND THE NEXT TWO EVENTS
		// =========================================================

		const today = new Date();
		today.setHours(0, 0, 0, 0);
		const todayString = `${today.getFullYear()}-${String(
			today.getMonth() + 1,
		).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;

		// Returns midnight on the Monday of the week leading up to the
		// event. Events fall on a Saturday or Sunday, so this is the
		// Monday 5–6 days earlier.
		function getMondayBefore(eventDate) {
			const monday = new Date(eventDate);
			const dayOfWeek = monday.getDay(); // 0 = Sunday ... 6 = Saturday
			const daysSinceMonday = (dayOfWeek + 6) % 7; // Mon = 0 ... Sun = 6

			// If the event itself falls on a Monday, step back a full week.
			monday.setDate(
				monday.getDate() - (daysSinceMonday === 0 ? 7 : daysSinceMonday),
			);
			monday.setHours(0, 0, 0, 0);

			return monday;
		}

		const upcomingEvents = events
			.map((event) => ({
				...event,

				// Noon prevents timezone conversion from changing the date.
				dateObject: new Date(`${event.date}T12:00:00`),
			}))
			.filter((event) => event.dateObject >= today)
			.sort((a, b) => a.dateObject - b.dateObject)
			.slice(0, 2);

		// =========================================================
		// UPDATE ONE CARD
		// =========================================================

		function updateCard(card, event) {
			if (!card || !event) {
				if (card) {
					card.hidden = true;
				}

				return;
			}

			const store = stores[event.store];

			if (!store) {
				console.error(
					`No store details found for "${event.store}". Check that the store name on this event matches a key in the stores object.`,
				);

				card.hidden = true;
				return;
			}

			const dateElement = card.querySelector(
				'.event-date .elementor-heading-title',
			);

			const locationElement = card.querySelector(
				'.event-location .elementor-widget-container',
			);

			const timeElement = card.querySelector(
				'.event-time .elementor-widget-container',
			);

			const attendeesElement = card.querySelector(
				'.event-attendees .elementor-widget-container',
			);

			if (!dateElement || !locationElement || !timeElement) {
				console.error(
					'An adoption-event card is missing an expected element.',
					card,
				);

				card.hidden = true;
				return;
			}

			const formattedDate = event.dateObject.toLocaleDateString('en-US', {
				weekday: 'long',
				month: 'long',
				day: 'numeric',
				year: 'numeric',
			});

			const eventDate = card.querySelector('.event-date');

			// Remove both state classes in case this card was
			// previously marked.
			eventDate.classList.remove('event-date-today', 'event-date-canceled');

			// Anything other than a status of canceled is treated as
			// going ahead, so a blank or misspelled status never hides
			// an event that is actually happening. Trimming and
			// lowercasing means "Canceled " still registers, and the
			// double-l spelling is accepted too.
			const status = String(event.status || '')
				.trim()
				.toLowerCase();

			const isCanceled = status === 'canceled' || status === 'cancelled';

			// A canceled event takes priority over the Today message.
			if (isCanceled) {
				dateElement.textContent = `${formattedDate} - Canceled`;
				eventDate.classList.add('event-date-canceled');
			} else if (event.date === todayString) {
				// If the event is today, append " - Today!" and highlight it.
				dateElement.textContent = `${formattedDate} - Today!`;
				eventDate.classList.add('event-date-today');
			} else {
				dateElement.textContent = formattedDate;
			}

			const [addressLine1, addressLine2] = formatAddressLines(store.address);

			locationElement.innerHTML = `
            <p>
                <a
                    href="${store.storeUrl}"
                    target="_blank"
                    rel="noopener"
                >
                    ${store.name}
                </a>
            </p>
            <div class="address-line">
                ${addressLine1}
            </div>
            <div class="address-line">
                ${addressLine2}
            </div>
        `;

			// An event may carry its own startTime or endTime when a store
			// runs that one fair at unusual hours. Each falls back to the
			// store's normal time independently, so a row can move just its
			// start or just its end.
			const startTime = event.startTime || store.startTime;
			const endTime = event.endTime || store.endTime;

			timeElement.innerHTML = `<p>${startTime} – ${endTime}</p>`;

			// Point the "Meet the attendees" link at this store's page.
			// Only the href is swapped so the link text and the arrow icon
			// beside it stay editable in Elementor. The link is
			// supplementary, so a missing widget is not fatal.
			//
			// The link is revealed from the Monday of the event week
			// onward. Before then a placeholder message shows instead.
			// A canceled event shows neither, since it has no attendees.
			if (attendeesElement) {
				const attendeesLink = attendeesElement.querySelector('a');

				if (attendeesLink) {
					attendeesLink.href = store.attendeesPage;
				} else {
					console.error('The attendees widget has no link.', card);
				}

				// Add the placeholder once, reusing it on later updates.
				if (!attendeesElement.querySelector('.event-attendees-pending')) {
					const pendingMessage = document.createElement('p');

					pendingMessage.className = 'event-attendees-pending';
					pendingMessage.textContent = 'Attendees list coming soon.';

					attendeesElement.appendChild(pendingMessage);
				}

				const attendeesReady =
					!isCanceled && today >= getMondayBefore(event.dateObject);

				const attendeesPending = !isCanceled && !attendeesReady;

				card.classList.toggle('attendees-ready', attendeesReady);
				card.classList.toggle('attendees-pending', attendeesPending);
			}

			card.hidden = false;
		}

		// =========================================================
		// POPULATE THE TWO CARDS
		// =========================================================

		cards.forEach((card, index) => {
			updateCard(card, upcomingEvents[index]);
		});
	});
</script>
