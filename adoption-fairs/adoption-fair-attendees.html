<!-- This file is used in an Elementor HTML block on the
https://fourpaws.org/petco-fairfax-adoption-fair/ and
https://fourpaws.org/petco-sterling-adoption-fair/ pages. It displays the cats
attending that adoption fair in a grid of cards, pulled from Shelterluv using a
saved query ID.

The script reads the page URL to decide which fair it is on, so the same block
works on both pages with no editing. Maintenance is only needed if a Shelterluv
saved query ID changes, a page slug changes, or a new location is added - all of
which are handled in the ADOPTION_FAIRS object in the script below. -->

<style>
	.paws-adoption-cards {
		display: grid;
		grid-template-columns: repeat(auto-fill, minmax(10.63rem, 1fr));
		gap: 1rem;
		width: 100%;
	}

	.paws-cat-card {
		display: flex;
		flex-direction: column;
		height: 100%;
		background: #fff;
		border-radius: 20px;
		overflow: hidden;
		text-decoration: none !important;
		color: inherit;
		border: 4px solid #dbe0e6 !important;
		transition:
			transform 0.5s ease,
			box-shadow 0.2s ease;
	}

	a.paws-cat-card:hover {
		text-decoration: none !important;
		box-shadow: rgba(149, 157, 165, 0.2) 0px 8px 24px;
		border: 4px solid #a5b1c0 !important;
		transform: translateY(-4px);
	}

	.paws-cat-card,
	.paws-cat-card:hover,
	.paws-cat-card:focus,
	.paws-cat-card:visited {
		text-decoration: none !important;
		color: inherit;
	}

	.paws-cat-card img {
		display: block;
		width: 100%;
		aspect-ratio: 4 / 3;
		object-fit: cover;
	}

	.paws-cat-content {
		display: flex;
		flex-direction: column;
		flex: 1;
		padding: 1rem;
	}

	.paws-cat-name {
		margin: 0 0 6px;
		font-size: 1rem;
		font-weight: 700;
		line-height: 1.2;
		padding: 0;
	}

	p.paws-cat-details {
		margin: 0;
		margin-top: auto;
		color: #223762;
		font-size: 0.8rem !important;
		line-height: 1.4;
	}

	.paws-no-cats {
		grid-column: 1 / -1;
		padding: 3rem 2rem;
		text-align: center;
		border: 4px solid #dbe0e6;
		border-radius: 20px;
		background: #fff;
	}

	.paws-no-cats p {
		margin: 0 0 1rem;
		color: #213862 !important;
	}

	.paws-no-cats-link {
		font-weight: 700;
	}
</style>

<script>
	// 4 Paws' Shelterluv organization ID.
	const SHELTER_ID = 531;

	// =========================================================
	// ADOPTION FAIRS
	// One entry per adoption fair page. The key must appear in
	// that page's URL, which is how the script knows which fair
	// it is displaying.
	//
	// Update savedQuery if Shelterluv's saved query ID changes.
	// To add a location, add an entry whose key appears in the
	// new page's slug.
	// =========================================================

	const ADOPTION_FAIRS = {
		fairfax: { name: 'Petco Fairfax', savedQuery: 5752 },
		sterling: { name: 'Petco Sterling', savedQuery: 5756 },
	};

	// Returns the fair matching the current page, or null if the URL
	// does not name a known location.
	//
	// Only the pathname is checked, so WordPress preview parameters
	// (?preview_id=...) are ignored and previews behave like the
	// published page.
	function getAdoptionFair() {
		const path = window.location.pathname.toLowerCase();
		const key = Object.keys(ADOPTION_FAIRS).find((slug) => path.includes(slug));

		if (!key) return null;

		return {
			key,

			// 'sterling' becomes 'Sterling', used in the console messages.
			label: key.charAt(0).toUpperCase() + key.slice(1),

			...ADOPTION_FAIRS[key],
		};
	}

	document.addEventListener('DOMContentLoaded', async () => {
		const container = document.querySelector('.paws-adoption-cards');
		if (!container) return;

		const fair = getAdoptionFair();

		// An unrecognized URL usually means a page slug changed or this
		// block was added to a new page. Show the "no cats" panel so
		// visitors still get a link to every adoptable cat.
		if (!fair) {
			console.error(
				'Adoption fair not recognized from the URL. Expected the page slug ' +
					`to contain one of: ${Object.keys(ADOPTION_FAIRS).join(', ')}.`,
			);

			container.innerHTML = createNoCatsHtml();
			return;
		}

		// Confirms in the browser console which fair was detected, so the
		// page can be spot-checked without digging into the network tab.
		console.log(
			`Displaying cats for the ${fair.label} fair. ` +
				`(${fair.name}, Shelterluv saved query ${fair.savedQuery}.)`,
		);

		try {
			const data = await fetchShelterluvAnimals(fair.savedQuery);
			const animals = data.animals || [];

			renderAnimals(container, animals);

			console.log(
				`${animals.length} ${animals.length === 1 ? 'cat' : 'cats'} ` +
					`loaded for the ${fair.label} fair.`,
			);
		} catch (error) {
			console.error(error);
			renderError(container);
		}
	});

	async function fetchShelterluvAnimals(queryId) {
		const response = await fetch(
			`https://new.shelterluv.com/api/v3/available-animals/${SHELTER_ID}?saved_query=${queryId}`,
		);

		if (!response.ok) {
			throw new Error(`Shelterluv request failed: ${response.status}`);
		}

		return response.json();
	}

	function renderAnimals(container, animals) {
		container.innerHTML = '';

		if (!animals.length) {
			container.innerHTML = createNoCatsHtml();
			return;
		}

		container.innerHTML = animals.map(createAnimalCardHtml).join('');
	}

	function createNoCatsHtml() {
		return `
            <div class="paws-no-cats">
                <p><strong>These paws haven't checked in yet!</strong></p>
                <p>Our featured attendees will be announced soon. Until then, you can meet all of our adoptable cats.</p>
                <p>
                    <a href="https://fourpaws.org/adopt-a-cat/available-cats/" class="paws-no-cats-link">
                        View All Adoptable Cats →
                    </a>
                </p>
            </div>
        `;
	}

	function createAnimalCardHtml(animal) {
		const photos = Object.values(animal.photos || {});
		const cover = photos.find((photo) => photo.isCover) || photos[0];
		const imageUrl = cover?.url || '';
		const name = animal.name || 'Cat';
		const ageText = formatAge(animal.birthday);

		return `
            <a class="paws-cat-card"
               href="${escapeHtml(animal.public_url || '#')}"
               target="_blank"
               rel="noopener">
                <img
                    src="${escapeHtml(imageUrl)}"
                    alt="${escapeHtml(name)}"
                    loading="lazy">
                <div class="paws-cat-content">
                    <h3 class="paws-cat-name">${escapeHtml(name)}</h3>
                    <p class="paws-cat-details">
                        <strong>Age:</strong> ${escapeHtml(ageText)}
                    </p>
                </div>
            </a>
        `;
	}

	function formatAge(timestamp) {
		if (!timestamp) return 'Unknown';

		const birthday = new Date(Number(timestamp) * 1000);
		const today = new Date();

		let years = today.getFullYear() - birthday.getFullYear();
		let months = today.getMonth() - birthday.getMonth();

		if (today.getDate() < birthday.getDate()) {
			months--;
		}

		if (months < 0) {
			years--;
			months += 12;
		}

		if (years > 0) {
			return years === 1 ? '1 year' : `${years} years`;
		}

		return months <= 0
			? 'Less than 1 month'
			: months === 1
				? '1 month'
				: `${months} months`;
	}

	function renderError(container) {
		container.innerHTML =
			'<p>Sorry, we couldn&rsquo;t load the cats right now.</p>';
	}

	function escapeHtml(string) {
		return String(string)
			.replace(/&/g, '&amp;')
			.replace(/</g, '&lt;')
			.replace(/>/g, '&gt;')
			.replace(/"/g, '&quot;')
			.replace(/'/g, '&#39;');
	}
</script>
