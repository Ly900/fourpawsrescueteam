<!-- This file is used in an Elementor HTML block on each store's adoption fair
page. It displays the cats attending that fair in a grid of cards, pulled from
Shelterluv using that store's saved query ID, and fills in the date and time of
that store's next fair.

The script reads the page URL and matches it against the stores in the global
data block, so the same block works on every fair page with no editing.

REQUIRES window.FourPaws.data, which is loaded site-wide by the adoption fair
data snippet in WordPress (kept in this repo as adoption-fairs-data.html). That
snippet is not part of any page, so nothing needs to be added alongside this
block. Saved query IDs, page paths, fair dates, and new locations are all
maintained in the snippet, not here.

The date and time are written into the Elementor text widget carrying the CSS
class "next-fair-date". That widget is optional: a page without one still shows
its cats, and the widget's own "TBD" text stays put if the store has no
upcoming fair on the schedule. -->

<style>
	.paws-adoption-cards {
		display: grid;
		grid-template-columns: repeat(auto-fill, minmax(10.63rem, 1fr));
		gap: 1rem;
		width: 100%;
	}

	.paws-cat-card {
		display: flex;
		flex-direction: column;
		height: 100%;
		background: #fff;
		border-radius: 20px;
		overflow: hidden;
		text-decoration: none !important;
		color: inherit;
		border: 4px solid #dbe0e6 !important;
		transition:
			transform 0.5s ease,
			box-shadow 0.2s ease;
	}

	a.paws-cat-card:hover {
		text-decoration: none !important;
		box-shadow: rgba(149, 157, 165, 0.2) 0px 8px 24px;
		border: 4px solid #a5b1c0 !important;
		transform: translateY(-4px);
	}

	.paws-cat-card,
	.paws-cat-card:hover,
	.paws-cat-card:focus,
	.paws-cat-card:visited {
		text-decoration: none !important;
		color: inherit;
	}

	.paws-cat-card img {
		display: block;
		width: 100%;
		aspect-ratio: 4 / 3;
		object-fit: cover;
	}

	.paws-cat-content {
		display: flex;
		flex-direction: column;
		flex: 1;
		padding: 1rem;
	}

	.paws-cat-name {
		margin: 0 0 6px;
		font-size: 1rem;
		font-weight: 700;
		line-height: 1.2;
		padding: 0;
	}

	p.paws-cat-details {
		margin: 0;
		margin-top: auto;
		color: #223762;
		font-size: 0.8rem !important;
		line-height: 1.4;
	}

	.paws-no-cats {
		grid-column: 1 / -1;
		padding: 3rem 2rem;
		text-align: center;
		border: 4px solid #dbe0e6;
		border-radius: 20px;
		background: #fff;
	}

	.paws-no-cats p {
		margin: 0 0 1rem;
		color: #213862 !important;
	}

	.paws-no-cats-link {
		font-weight: 700;
	}
</style>

<script>
	// Lowercases a path and gives it one leading and one trailing
	// slash, so '/Petco-Fairfax-Adoption-Fair' and
	// '/petco-fairfax-adoption-fair/' compare as equal.
	function normalizePath(path) {
		return `/${String(path)
			.toLowerCase()
			.replace(/^\/+|\/+$/g, '')}/`;
	}

	// Returns the store whose adoption fair page we are on, or null if
	// the URL does not name a known store.
	//
	// Only the pathname is checked, so WordPress preview parameters
	// (?preview_id=...) are ignored and previews behave like the
	// published page.
	function findStoreForPage(stores) {
		const path = normalizePath(window.location.pathname);
		const entries = Object.entries(stores);

		// Normally the path is exactly the store's attendeesPage.
		let entry = entries.find(
			([, store]) =>
				store.attendeesPage && normalizePath(store.attendeesPage) === path,
		);

		// If it is not, fall back to looking for the store key
		// ('fairfax', 'sterling') anywhere in the path. This keeps the
		// page working if a slug is renamed and the data snippet has not
		// caught up yet.
		if (!entry) {
			entry = entries.find(([key]) => path.includes(key.toLowerCase()));
		}

		return entry ? { key: entry[0], ...entry[1] } : null;
	}

	// Anything other than a status of canceled is treated as going
	// ahead, so a blank or misspelled status never hides a fair that is
	// actually happening. Trimming and lowercasing means 'Canceled '
	// still registers, and the double-l spelling is accepted too.
	function isCanceled(event) {
		const status = String(event.status || '')
			.trim()
			.toLowerCase();

		return status === 'canceled' || status === 'cancelled';
	}

	// Returns this store's soonest remaining fair, or null if none is
	// left on the schedule.
	//
	// Canceled dates are skipped rather than labeled. This page
	// introduces the date as the next fair and lists the cats coming to
	// it, so a called-off date would read as an invitation. The
	// homepage cards are where cancellations get announced.
	function findNextEventForStore(events, storeKey) {
		const today = new Date();
		today.setHours(0, 0, 0, 0);

		const upcoming = (events || [])
			.filter((event) => event.store === storeKey && !isCanceled(event))

			// Noon prevents timezone conversion from changing the date.
			.map((event) => ({
				...event,
				dateObject: new Date(`${event.date}T12:00:00`),
			}))
			.filter((event) => event.dateObject >= today)
			.sort((a, b) => a.dateObject - b.dateObject);

		return upcoming[0] || null;
	}

	// Builds '1:00 PM – 5:00 PM' from the store's usual hours. A single
	// event can override the start, the end, or both when that one fair
	// runs at unusual times, matching how the homepage cards read the
	// same fields.
	//
	// Returns an empty string when no hours are recorded, so a store
	// missing its times still gets a date rather than a stray dash.
	function formatFairHours(event, store) {
		const startTime = event.startTime || store.startTime;
		const endTime = event.endTime || store.endTime;

		if (startTime && endTime) {
			return `${startTime} – ${endTime}`;
		}

		return startTime || endTime || '';
	}

	// Fills in the next fair date and time, if this page has a widget
	// for it.
	//
	// The widget ships with a 'TBD' placeholder, which is left alone
	// when the store has no upcoming fair. That way the page reads
	// sensibly on its own if the schedule runs out.
	function renderNextFairDate(event, store) {
		// Elementor puts a custom class on the outer widget element, so
		// aim for the inner container and fall back to the element
		// itself in case the class was added directly to it.
		const element =
			document.querySelector('.next-fair-date .elementor-widget-container') ||
			document.querySelector('.next-fair-date');

		if (!element) return;

		if (!event) {
			console.log(
				`No upcoming fair is scheduled for ${store.name}, so the date is ` +
					'left as is. Add the next date to the adoption fair data snippet.',
			);

			return;
		}

		const formattedDate = event.dateObject.toLocaleDateString('en-US', {
			weekday: 'long',
			month: 'long',
			day: 'numeric',
			year: 'numeric',
		});

		const hours = formatFairHours(event, store);
		const text = hours ? `${formattedDate}, ${hours}` : formattedDate;

		// Matches the markup the widget already uses, so the bold styling
		// set in Elementor carries over.
		element.innerHTML = `<p><strong>${escapeHtml(text)}</strong></p>`;
	}

	document.addEventListener('DOMContentLoaded', async () => {
		const container = document.querySelector('.paws-adoption-cards');
		if (!container) return;

		// Everything below comes from the site-wide data snippet, which
		// runs in the page header and so is already in place by the time
		// this handler fires.
		const data = window.FourPaws && window.FourPaws.data;

		// Without that data there is no saved query to fetch and no link
		// to offer, so this is a real breakage rather than a fair with no
		// cats yet.
		if (!data || !data.stores) {
			console.error(
				'Adoption fair data is missing. Check that the adoption fair data snippet is active in WordPress.',
			);

			renderError(container);
			return;
		}

		const store = findStoreForPage(data.stores);

		// An unrecognized URL usually means a page slug changed or this
		// block was added to a new page. Show the "no cats" panel so
		// visitors still get a link to every adoptable cat.
		if (!store) {
			console.error(
				'Adoption fair not recognized from the URL. Expected the page path ' +
					`to match one of: ${Object.keys(data.stores).join(', ')}.`,
			);

			container.innerHTML = createNoCatsHtml(data.availableCatsPage);
			return;
		}

		// Done before the cats are fetched so the date still appears if
		// Shelterluv is slow or unreachable, or if this store has no
		// saved query yet.
		renderNextFairDate(
			findNextEventForStore(data.adoptionEvents, store.key),
			store,
		);

		// A store with no saved query has no attendee list set up yet.
		if (!store.savedQuery) {
			console.error(
				`No Shelterluv saved query is set for ${store.name}. Add a savedQuery to that store in the adoption fair data snippet.`,
			);

			container.innerHTML = createNoCatsHtml(data.availableCatsPage);
			return;
		}

		// Confirms in the browser console which fair was detected, so the
		// page can be spot-checked without digging into the network tab.
		console.log(
			`Displaying cats for ${store.name}. ` +
				`(Shelterluv saved query ${store.savedQuery}.)`,
		);

		try {
			const response = await fetchShelterluvAnimals(
				data.shelterId,
				store.savedQuery,
			);

			const animals = response.animals || [];

			renderAnimals(container, animals, data.availableCatsPage);

			console.log(
				`${animals.length} ${animals.length === 1 ? 'cat' : 'cats'} ` +
					`loaded for ${store.name}.`,
			);
		} catch (error) {
			console.error(error);
			renderError(container);
		}
	});

	async function fetchShelterluvAnimals(shelterId, queryId) {
		const response = await fetch(
			`https://new.shelterluv.com/api/v3/available-animals/${shelterId}?saved_query=${queryId}`,
		);

		if (!response.ok) {
			throw new Error(`Shelterluv request failed: ${response.status}`);
		}

		return response.json();
	}

	function renderAnimals(container, animals, availableCatsPage) {
		container.innerHTML = '';

		if (!animals.length) {
			container.innerHTML = createNoCatsHtml(availableCatsPage);
			return;
		}

		container.innerHTML = animals.map(createAnimalCardHtml).join('');
	}

	function createNoCatsHtml(availableCatsPage) {
		return `
            <div class="paws-no-cats">
                <p><strong>These paws haven't checked in yet!</strong></p>
                <p>Our featured attendees will be announced soon. Until then, you can meet all of our adoptable cats.</p>
                <p>
                    <a href="${escapeHtml(availableCatsPage)}" class="paws-no-cats-link">
                        View All Adoptable Cats →
                    </a>
                </p>
            </div>
        `;
	}

	function createAnimalCardHtml(animal) {
		const photos = Object.values(animal.photos || {});
		const cover = photos.find((photo) => photo.isCover) || photos[0];
		const imageUrl = cover?.url || '';
		const name = animal.name || 'Cat';
		const ageText = formatAge(animal.birthday);

		return `
            <a class="paws-cat-card"
               href="${escapeHtml(animal.public_url || '#')}"
               target="_blank"
               rel="noopener">
                <img
                    src="${escapeHtml(imageUrl)}"
                    alt="${escapeHtml(name)}"
                    loading="lazy">
                <div class="paws-cat-content">
                    <h3 class="paws-cat-name">${escapeHtml(name)}</h3>
                    <p class="paws-cat-details">
                        <strong>Age:</strong> ${escapeHtml(ageText)}
                    </p>
                </div>
            </a>
        `;
	}

	function formatAge(timestamp) {
		if (!timestamp) return 'Unknown';

		const birthday = new Date(Number(timestamp) * 1000);
		const today = new Date();

		let years = today.getFullYear() - birthday.getFullYear();
		let months = today.getMonth() - birthday.getMonth();

		if (today.getDate() < birthday.getDate()) {
			months--;
		}

		if (months < 0) {
			years--;
			months += 12;
		}

		if (years > 0) {
			return years === 1 ? '1 year' : `${years} years`;
		}

		return months <= 0
			? 'Less than 1 month'
			: months === 1
				? '1 month'
				: `${months} months`;
	}

	function renderError(container) {
		container.innerHTML =
			'<p>Sorry, we couldn&rsquo;t load the cats right now.</p>';
	}

	function escapeHtml(string) {
		return String(string)
			.replace(/&/g, '&amp;')
			.replace(/</g, '&lt;')
			.replace(/>/g, '&gt;')
			.replace(/"/g, '&quot;')
			.replace(/'/g, '&#39;');
	}
</script>
