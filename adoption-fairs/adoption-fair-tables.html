<!-- Builds the two tables on the Adoption Fairs and Events page: the schedule of
upcoming adoption fairs, and the list of dates when aluminum cans can be dropped
off at Petco Fairfax.

Add these two empty divs to the page wherever each table should appear. This
block fills them in. A page may have one, both, or neither; a div that is not
there is simply skipped.

    <div class="adoption-fair-table"></div>
    <div class="aluminum-cans-table"></div>

Past dates drop off on their own, so no one has to prune old rows by hand.

In the fairs table, a "See Attendees" link sits next to the date once that
store's attendees page goes live, which is the Monday of the week leading up to
the fair. Until then the date stands on its own, and the note under the table
explains when the link turns up. A canceled fair never gets one. The homepage
cards reveal their own attendees link on the same schedule, so if that timing
ever changes it has to be changed in BOTH this file and
homepage/homepage-adoption-fairs.html.

REQUIRES window.FourPaws.data, which is loaded site-wide by the adoption fair
data snippet in WordPress (kept in this repo as adoption-fairs-data.html). That
snippet is not part of any page, so nothing needs to be added alongside this
block. Event dates, store details, fair hours, and the attendees page addresses
are all edited in the snippet, not here.

If that snippet is ever missing or broken, the tables are replaced by a short
message asking the visitor to email info@fourpaws.org, and the reason is written
to the browser console. There are no hand-coded backup tables on the page; a
copy of the old ones is kept in this repo under deprecated/. -->

<style>
	/* Hides text on screen while leaving it available to screen
	   readers. Every "See Attendees" link reads the same out of
	   context, so each one carries a hidden mention of its store and
	   date. Named for this block rather than reusing the theme's
	   screen-reader class, so a theme update cannot quietly change
	   what it does. */
	.paws-table-sr-only {
		position: absolute !important;
		width: 1px !important;
		height: 1px !important;
		padding: 0 !important;
		margin: -1px !important;
		overflow: hidden !important;
		clip: rect(0, 0, 0, 0) !important;
		white-space: nowrap !important;
		border: 0 !important;
	}

	.paws-table-note {
		margin-top: 0.5rem;
		font-size: 1rem !important;
	}

	/* =========================================================
	   NARROW SCREENS
	   The tables carry more columns than fit on a phone, so below
	   this width the figure around each one scrolls sideways
	   rather than squeezing every column down to a few characters.
	   Everything here is inside the media query on purpose: on a
	   full-size screen the tables lay themselves out the way they
	   always have, and none of this touches them.
	   ========================================================= */
	@media (max-width: 767px) {
		/* A box that scrolls has to be reachable from the keyboard,
		   or someone not using a mouse has no way to move it. That
		   is what the tabindex on the figure is for, and the
		   outline makes it clear what is about to scroll. */
		.paws-table-scroll {
			overflow-x: auto;
			-webkit-overflow-scrolling: touch;
		}

		.paws-table-scroll:focus-visible {
			outline: 3px solid #3b5991;
			outline-offset: 2px;
		}

		/* The width the table spreads out to once it is free of the
		   screen, which is what gives it something to scroll. The
		   cells still wrap as they normally would, so a long date
		   takes a second line rather than dragging the whole table
		   wider and forcing more scrolling on everyone. */
		.paws-table-scroll table {
			min-width: 30rem;
		}

		/* The date column stays in place while the rest slides
		   past, so it is always clear which fair a phone number or
		   attendees link belongs to. */
		.paws-table-scroll th:first-child,
		.paws-table-scroll td:first-child {
			position: sticky;
			left: 0;
			z-index: 1;

			/* Stands the column off from what slides beneath it. */
			box-shadow: 1px 0 0 #c2cee5;
		}

		/* The theme paints its row colors on the row itself, which
		   a stuck cell slides out from under, leaving it
		   see-through. So the first column repeats those colors on
		   the cells: the same blue as the heading, and the same
		   banding as the rows. */
		.paws-table-scroll thead th:first-child {
			background-color: #3b5991;
		}

		.paws-table-scroll tbody tr:nth-child(odd) td:first-child {
			background-color: #eaeffa;
		}

		.paws-table-scroll tbody tr:nth-child(even) td:first-child {
			background-color: #ffffff;
		}
	}
</style>

<script>
	document.addEventListener('DOMContentLoaded', () => {
		// The two divs this block fills in. A page may carry one, both,
		// or neither.
		const tableSelectors = ['.adoption-fair-table', '.aluminum-cans-table'];

		// =========================================================
		// WHEN SOMETHING IS BROKEN
		// Shown only when the schedule cannot be read at all. An empty
		// space would leave a visitor with nowhere to turn, so point
		// them at someone who can answer.
		//
		// This is not the same as having no fairs booked. That case is
		// normal, and each table says so in its own words further down.
		// =========================================================

		function showFailureMessage() {
			tableSelectors.forEach((selector) => {
				const container = document.querySelector(selector);

				if (container) {
					container.innerHTML =
						'<p>Our adoption fair schedule isn\'t loading right now. Please contact 4Paws at <a href="mailto:info@fourpaws.org">info@fourpaws.org</a> for our upcoming fair dates.</p>';
				}
			});
		}

		// =========================================================
		// SHARED EVENT DATA
		// Event dates and store details come from window.FourPaws.data,
		// set by the site-wide adoption fair data snippet. That snippet
		// runs in the page footer, which is still before DOMContentLoaded
		// fires, so the data is already in place by the time this handler
		// runs. Nothing in this file needs editing when the schedule
		// changes.
		// =========================================================

		const data = window.FourPaws && window.FourPaws.data;
		const events = data && data.adoptionEvents;
		const stores = data && data.stores;

		if (!Array.isArray(events) || !stores) {
			console.error(
				'Adoption fair data is missing. Check that the adoption fair data snippet is active in WordPress.',
			);

			showFailureMessage();
			return;
		}

		// =========================================================
		// UPCOMING EVENTS
		// Everything from today forward, earliest first. Canceled
		// events stay on the list so anyone who was planning to
		// attend still sees the notice.
		// =========================================================

		const today = new Date();
		today.setHours(0, 0, 0, 0);

		const upcomingEvents = events
			.map((event) => ({
				...event,

				// Noon prevents timezone conversion from changing the date.
				dateObject: new Date(`${event.date}T12:00:00`),
			}))
			.filter((event) => event.dateObject >= today)
			.sort((a, b) => a.dateObject - b.dateObject);

		// =========================================================
		// TIME FORMATTING
		// The shared data writes times the long way, '1:00 PM'. The
		// tables want them short, so '1:00 PM' to '5:00 PM' reads
		// "1-5 pm".
		// =========================================================

		// '1:00 PM' becomes { hour: 1, minute: 0, meridiem: 'pm' }.
		// Anything that does not match returns null so the caller can
		// fall back to the original text rather than print gibberish.
		function parseTime(time) {
			const match = String(time || '')
				.trim()
				.match(/^(\d{1,2})(?::(\d{2}))?\s*([AaPp])\.?[Mm]\.?$/);

			if (!match) {
				return null;
			}

			return {
				hour: Number(match[1]),
				minute: Number(match[2] || 0),
				meridiem: match[3].toLowerCase() === 'a' ? 'am' : 'pm',
			};
		}

		// On the hour prints as '1'; anything else keeps its minutes,
		// as in '1:30'.
		function formatClock(time) {
			return time.minute === 0
				? String(time.hour)
				: `${time.hour}:${String(time.minute).padStart(2, '0')}`;
		}

		// Both times in the same half of the day share one meridiem,
		// giving "1-5 pm". A fair running from morning to afternoon
		// needs both, giving "11 am-3 pm".
		function formatTimeRange(startTime, endTime) {
			const start = parseTime(startTime);
			const end = parseTime(endTime);

			if (!start || !end) {
				console.error(
					`Could not read the fair times "${startTime}" and "${endTime}". Check that they are written like '1:00 PM' in the adoption fair data snippet.`,
				);

				return `${startTime} - ${endTime}`;
			}

			if (start.meridiem === end.meridiem) {
				return `${formatClock(start)}-${formatClock(end)} ${end.meridiem}`;
			}

			return `${formatClock(start)} ${start.meridiem}-${formatClock(end)} ${
				end.meridiem
			}`;
		}

		// 'July 25'. The year is left off because the tables only ever
		// show dates still to come.
		function formatDate(event) {
			return event.dateObject.toLocaleDateString('en-US', {
				month: 'long',
				day: 'numeric',
			});
		}

		// Anything other than a status of canceled is treated as going
		// ahead, so a blank or misspelled status never hides an event
		// that is actually happening. Trimming and lowercasing means
		// "Canceled " still registers, and the double-l spelling is
		// accepted too.
		function isCanceled(event) {
			const status = String(event.status || '')
				.trim()
				.toLowerCase();

			return status === 'canceled' || status === 'cancelled';
		}

		// =========================================================
		// WHEN THE ATTENDEES LIST GOES LIVE
		// Each store's attendees page fills with cats on the Monday of
		// the week leading up to its fair. Before then the link would
		// lead to an empty page, so the date stands on its own.
		//
		// This matches the homepage cards. The same rule is written
		// out in homepage/homepage-adoption-fairs.html; changing the
		// timing means editing both files.
		// =========================================================

		// Returns midnight on the Monday of the week leading up to the
		// event. Events fall on a Saturday or Sunday, so this is the
		// Monday 5-6 days earlier.
		function getMondayBefore(eventDate) {
			const monday = new Date(eventDate);
			const dayOfWeek = monday.getDay(); // 0 = Sunday ... 6 = Saturday
			const daysSinceMonday = (dayOfWeek + 6) % 7; // Mon = 0 ... Sun = 6

			// If the event itself falls on a Monday, step back a full week.
			monday.setDate(
				monday.getDate() - (daysSinceMonday === 0 ? 7 : daysSinceMonday),
			);
			monday.setHours(0, 0, 0, 0);

			return monday;
		}

		// A canceled fair has no attendees, so its link never appears.
		function isAttendeesReady(event) {
			return !isCanceled(event) && today >= getMondayBefore(event.dateObject);
		}

		// =========================================================
		// BUILDING A TABLE
		// Both tables share this builder. Each passes its own list of
		// columns, which events to include, a label naming the table
		// for screen readers, and an optional note to sit underneath.
		// =========================================================

		// Phone numbers are stored for reading, '703-352-3300'. A tel:
		// link wants digits only.
		function toPhoneHref(phoneNumber) {
			return `tel:${String(phoneNumber).replace(/\D/g, '')}`;
		}

		function renderTable(config) {
			const container = document.querySelector(config.selector);

			// Not every page carries both tables.
			if (!container) {
				return;
			}

			const rows = [];

			upcomingEvents.filter(config.filter).forEach((event) => {
				const store = stores[event.store];

				// One bad store name costs a single row instead of the
				// whole table.
				if (!store) {
					console.error(
						`No store details found for "${event.store}" on ${event.date}. Check that the store name on this event matches a key in the stores object.`,
					);

					return;
				}

				const cells = config.columns
					.map((column) => `<td>${column.cell(event, store)}</td>`)
					.join('');

				rows.push(`<tr data-date="${event.date}">${cells}</tr>`);
			});

			// An empty table would read as though the page were broken.
			if (!rows.length) {
				container.innerHTML = `<p>${config.emptyMessage}</p>`;

				return;
			}

			const headings = config.columns
				.map((column) => `<th>${column.heading}</th>`)
				.join('');

			// The note is written out with the table rather than typed
			// into its own Elementor widget, so it cannot be left
			// stranded if the table moves, and it disappears along with
			// the table if the schedule fails to load.
			const note = config.note
				? `<p class="paws-table-note">${config.note}</p>`
				: '';

			// The figure is the part that scrolls sideways on a
			// narrow screen. Read aloud, one scrolling box is hard to
			// tell from another, so each table says which one it is.
			// The note stays outside it, as a line of ordinary text
			// should wrap rather than scroll.
			container.innerHTML = `
				<figure
					class="paws-table-scroll"
					role="region"
					aria-label="${config.label}"
					tabindex="0"
				>
					<table class="paws-table">
						<thead>
							<tr>${headings}</tr>
						</thead>
						<tbody>${rows.join('')}</tbody>
					</table>
				</figure>
				${note}
			`;
		}

		// =========================================================
		// COLUMNS SHARED BY BOTH TABLES
		// =========================================================

		const storeColumn = {
			heading: 'Store Location',

			cell: (event, store) => `
				<a
					href="${store.storeUrl}"
					target="_blank"
					rel="noreferrer noopener"
					>${store.name}</a
				>
			`,
		};

		const phoneColumn = {
			heading: 'Store Phone Number',

			cell: (event, store) =>
				`<a href="${toPhoneHref(store.phoneNumber)}">${store.phoneNumber}</a>`,
		};

		// =========================================================
		// BUILDING BOTH TABLES
		// Anything unexpected in here leaves a half-built table on the
		// page, which looks like a mistake nobody noticed. Catching it
		// swaps in the contact message instead.
		// =========================================================

		try {
			// -----------------------------------------------------
			// THE ADOPTION FAIRS TABLE
			// Every upcoming fair, at every store.
			// -----------------------------------------------------

			renderTable({
				selector: '.adoption-fair-table',

				label: 'Upcoming adoption fairs',

				filter: () => true,

				columns: [
					{
						heading: 'Date and Time',

						cell(event, store) {
							// An event may carry its own startTime or endTime
							// when a store runs that one fair at unusual hours.
							// Each falls back to the store's normal time
							// independently, so a row can move just its start
							// or just its end.
							const timeRange = formatTimeRange(
								event.startTime || store.startTime,
								event.endTime || store.endTime,
							);

							const dateAndTime = `${formatDate(event)}, ${timeRange}`;

							if (isCanceled(event)) {
								return `${dateAndTime} - <b>Canceled</b>`;
							}

							// Only a handful of fairs have their list up at any
							// one time, so the link rides along with the date
							// rather than taking a column of its own that would
							// sit empty on nearly every row.
							if (!isAttendeesReady(event)) {
								return dateAndTime;
							}

							// A screen reader can read the links on a page as a
							// list, away from the dates beside them, and every
							// one of these would say the same thing. The hidden
							// half names the fair it belongs to.
							// The hyphen sits outside the link, the same way the
							// canceled note above is set off from the date.
							return `
								${dateAndTime} -
								<a href="${store.attendeesPage}"
									><strong>See Attendees</strong
									><span class="paws-table-sr-only"> for ${
										store.name
									} on ${formatDate(event)}</span></a
								>
							`;
						},
					},

					storeColumn,
					phoneColumn,
				],

				note: '*Attendee lists are posted the Monday before each fair.',

				emptyMessage:
					'No adoption fairs are scheduled right now. Please check back soon.',
			});

			// -----------------------------------------------------
			// THE ALUMINUM CANS TABLE
			// Cans are collected at Petco Fairfax only, and always up
			// until 3 pm regardless of how long that day's fair runs.
			// -----------------------------------------------------

			renderTable({
				selector: '.aluminum-cans-table',

				label: 'Aluminum can collection dates',

				filter: (event) => event.store === 'fairfax',

				columns: [
					{
						heading: 'Date and Time',

						// Canceled fairs are listed here as ordinary rows.
						// Cans can still be dropped off that day, so the
						// "Canceled" note that the adoption fairs table
						// shows would be misleading.
						cell: (event) => `${formatDate(event)}, before 3 pm`,
					},

					storeColumn,
					phoneColumn,
				],

				emptyMessage:
					'No can collection dates are scheduled right now. Please check back soon.',
			});
		} catch (error) {
			console.error('The adoption fair tables could not be built.', error);

			showFailureMessage();
		}
	});
</script>
